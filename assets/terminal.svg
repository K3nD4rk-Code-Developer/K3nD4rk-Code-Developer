<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 620" width="830" height="620" role="img" aria-labelledby="t d">
  <title id="t">K3nD4rk terminal</title>
  <desc id="d">A terminal window running neofetch beside an animated flower that blooms. K3nD4rk is a software engineer and game architect working in Luau, Python, C++, Java, TypeScript and JavaScript with Unity, Unreal and Roblox Studio. 1,942 contributions, 345 commits, 134 pull requests, 13 stars. Contact on Discord at kennum_ or on GitHub.</desc>
  <style>
    .mono { font-family: 'JetBrains Mono','DejaVu Sans Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size: 13px; }
    .key  { fill: #b0303a; }
    .val  { fill: #d8d3d2; }
    .dim  { fill: #7d7374; }
    .usr  { fill: #b0303a; font-weight: 700; }
    .ln   { opacity: 0; animation: show .5s ease-out both; }
    @keyframes show { from { opacity: 0; } to { opacity: 1; } }

    .petal { transform-box: fill-box; transform-origin: 50% 100%; animation: bloom 10s cubic-bezier(.3,.7,.3,1) infinite both; }
    @keyframes bloom {
      0%, 6%   { transform: rotate(-30deg) scale(0); opacity: 0; }
      42%      { transform: rotate(0deg) scale(1.06); opacity: 1; }
      52%, 86% { transform: rotate(0deg) scale(1); opacity: 1; }
      97%,100% { transform: rotate(8deg) scale(0); opacity: 0; }
    }
    .core { transform-box: fill-box; transform-origin: 50% 50%; animation: core 10s ease-out infinite both; }
    @keyframes core {
      0%, 30% { transform: scale(0); }
      48%, 88% { transform: scale(1); }
      97%,100% { transform: scale(0); }
    }
    .stem { stroke-dasharray: 100; animation: grow 10s ease-out infinite both; }
    @keyframes grow {
      0%   { stroke-dashoffset: 100; }
      16%, 90% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 100; }
    }
    .leaf { transform-box: fill-box; transform-origin: 100% 100%; animation: leaf 10s ease-out infinite both; }
    .leaf.r { transform-origin: 0% 100%; }
    @keyframes leaf {
      0%, 12% { transform: scale(0); }
      30%, 90% { transform: scale(1); }
      100% { transform: scale(0); }
    }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .petal, .core, .stem, .leaf, .ln, .cursor { animation: none; opacity: 1; transform: none; stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <clipPath id="type"><rect x="141" y="52" height="24" width="0"><animate attributeName="width" from="0" to="72" dur="0.8s" begin="0.3s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="829" height="619" rx="10" fill="#0c0a0a" stroke="#2a2020"/>
  <path d="M0.5 36 V10.5 a10 10 0 0 1 10 -10 H819.5 a10 10 0 0 1 10 10 V36 Z" fill="#171213"/>
  <line x1="0" y1="36.5" x2="830" y2="36.5" stroke="#2a2020"/>
  <circle cx="22" cy="18.5" r="5.5" fill="#a3272f"/>
  <circle cx="42" cy="18.5" r="5.5" fill="#4a4142"/>
  <circle cx="62" cy="18.5" r="5.5" fill="#4a4142"/>
  <text x="415" y="23" text-anchor="middle" class="mono dim">k3nd4rk@dev: ~</text>

  <text x="24" y="70" class="mono"><tspan class="usr">k3nd4rk@dev</tspan><tspan class="dim">:~$ </tspan></text>
  <text x="141" y="70" class="mono val" clip-path="url(#type)">neofetch</text>

  <!-- flower -->
  <g>
    <ellipse cx="170" cy="374" rx="52" ry="5" fill="#1b1617"/>
    <path class="stem" pathLength="100" d="M170 372 C 167 336, 174 290, 170 236" fill="none" stroke="#5c5354" stroke-width="3" stroke-linecap="round"/>
    <path class="leaf" d="M170 338 C 146 336, 128 322, 124 304 C 148 306, 166 318, 170 338 Z" fill="#4a4142"/>
    <path class="leaf r" d="M170 322 C 194 320, 212 306, 216 288 C 192 290, 174 302, 170 322 Z" fill="#3b3334"/>

    <g transform="translate(170 224)">
      <g transform="rotate(0)"><ellipse class="petal" style="animation-delay:.00s" cx="0" cy="-34" rx="14" ry="34" fill="#7a1f28"/></g>
      <g transform="rotate(45)"><ellipse class="petal" style="animation-delay:.10s" cx="0" cy="-34" rx="14" ry="34" fill="#7a1f28"/></g>
      <g transform="rotate(90)"><ellipse class="petal" style="animation-delay:.20s" cx="0" cy="-34" rx="14" ry="34" fill="#7a1f28"/></g>
      <g transform="rotate(135)"><ellipse class="petal" style="animation-delay:.30s" cx="0" cy="-34" rx="14" ry="34" fill="#7a1f28"/></g>
      <g transform="rotate(180)"><ellipse class="petal" style="animation-delay:.40s" cx="0" cy="-34" rx="14" ry="34" fill="#7a1f28"/></g>
      <g transform="rotate(225)"><ellipse class="petal" style="animation-delay:.50s" cx="0" cy="-34" rx="14" ry="34" fill="#7a1f28"/></g>
      <g transform="rotate(270)"><ellipse class="petal" style="animation-delay:.60s" cx="0" cy="-34" rx="14" ry="34" fill="#7a1f28"/></g>
      <g transform="rotate(315)"><ellipse class="petal" style="animation-delay:.70s" cx="0" cy="-34" rx="14" ry="34" fill="#7a1f28"/></g>

      <g transform="rotate(22.5)"><ellipse class="petal" style="animation-delay:.9s" cx="0" cy="-24" rx="10" ry="24" fill="#a3272f"/></g>
      <g transform="rotate(67.5)"><ellipse class="petal" style="animation-delay:1.0s" cx="0" cy="-24" rx="10" ry="24" fill="#a3272f"/></g>
      <g transform="rotate(112.5)"><ellipse class="petal" style="animation-delay:1.1s" cx="0" cy="-24" rx="10" ry="24" fill="#a3272f"/></g>
      <g transform="rotate(157.5)"><ellipse class="petal" style="animation-delay:1.2s" cx="0" cy="-24" rx="10" ry="24" fill="#a3272f"/></g>
      <g transform="rotate(202.5)"><ellipse class="petal" style="animation-delay:1.3s" cx="0" cy="-24" rx="10" ry="24" fill="#a3272f"/></g>
      <g transform="rotate(247.5)"><ellipse class="petal" style="animation-delay:1.4s" cx="0" cy="-24" rx="10" ry="24" fill="#a3272f"/></g>
      <g transform="rotate(292.5)"><ellipse class="petal" style="animation-delay:1.5s" cx="0" cy="-24" rx="10" ry="24" fill="#a3272f"/></g>
      <g transform="rotate(337.5)"><ellipse class="petal" style="animation-delay:1.6s" cx="0" cy="-24" rx="10" ry="24" fill="#a3272f"/></g>

      <circle class="core" cx="0" cy="0" r="10" fill="#1a1415" stroke="#c9414d" stroke-width="1.5"/>
      <circle class="core" cx="0" cy="0" r="3" fill="#d8d3d2"/>
    </g>
  </g>

  <!-- left column: stats -->
  <g class="mono">
    <text x="24" y="412" class="ln dim" style="animation-delay:1.4s"># stats</text>
    <text x="24" y="438" class="ln" style="animation-delay:1.5s"><tspan class="key">contributions</tspan><tspan x="150" class="val">1,942</tspan></text>
    <text x="24" y="462" class="ln" style="animation-delay:1.62s"><tspan class="key">commits</tspan><tspan x="150" class="val">345</tspan></text>
    <text x="24" y="486" class="ln" style="animation-delay:1.74s"><tspan class="key">pull requests</tspan><tspan x="150" class="val">134</tspan></text>
    <text x="24" y="510" class="ln" style="animation-delay:1.86s"><tspan class="key">streak</tspan><tspan x="150" class="val">10 days · best 28</tspan></text>
    <text x="24" y="534" class="ln" style="animation-delay:1.98s"><tspan class="key">stars</tspan><tspan x="150" class="val">13</tspan></text>
    <text x="24" y="558" class="ln" style="animation-delay:2.1s"><tspan class="key">contributed to</tspan><tspan x="150" class="val">8 repos</tspan></text>
  </g>

  <!-- right column: profile -->
  <g class="mono">
    <text x="330" y="112" class="ln usr" style="animation-delay:1.2s">k3nd4rk@dev</text>
    <text x="330" y="130" class="ln dim" style="animation-delay:1.25s">-----------</text>

    <text x="330" y="158" class="ln" style="animation-delay:1.3s"><tspan class="key">role</tspan><tspan x="415" class="val">software engineer / game architect</tspan></text>
    <text x="330" y="182" class="ln" style="animation-delay:1.42s"><tspan class="key">focus</tspan><tspan x="415" class="val">game systems, tooling</tspan></text>
    <text x="330" y="206" class="ln" style="animation-delay:1.54s"><tspan class="key">langs</tspan><tspan x="415" class="val">Luau · Python · C++ · Java · TS · JS</tspan></text>
    <text x="330" y="230" class="ln" style="animation-delay:1.66s"><tspan class="key">engines</tspan><tspan x="415" class="val">Unity · Unreal · Roblox Studio</tspan></text>
    <text x="330" y="254" class="ln" style="animation-delay:1.78s"><tspan class="key">tools</tspan><tspan x="415" class="val">Git · VS Code</tspan></text>
    <text x="330" y="278" class="ln" style="animation-delay:1.9s"><tspan class="key">awards</tspan><tspan x="415" class="val">FBLA Nationals finalist · CodeQuest winner</tspan></text>
    <text x="330" y="302" class="ln" style="animation-delay:2.02s"><tspan class="key">roots</tspan><tspan x="415" class="val">robotics + competitive programming</tspan></text>
    <text x="330" y="326" class="ln" style="animation-delay:2.14s"><tspan class="key">offline</tspan><tspan x="415" class="val">boxing · wrestling · music</tspan></text>
    <text x="330" y="350" class="ln" style="animation-delay:2.26s"><tspan class="key">volunteer</tspan><tspan x="415" class="val">teaching tech to beginners</tspan></text>
    <text x="330" y="374" class="ln" style="animation-delay:2.38s"><tspan class="key">active</tspan><tspan x="415" class="val">since 2021 · busiest after 8pm</tspan></text>

    <text x="330" y="412" class="ln dim" style="animation-delay:2.5s"># contact</text>
    <text x="330" y="438" class="ln" style="animation-delay:2.6s"><tspan class="key">discord</tspan><tspan x="415" class="val">kennum_</tspan></text>
    <text x="330" y="462" class="ln" style="animation-delay:2.72s"><tspan class="key">github</tspan><tspan x="415" class="val">github.com/K3nD4rk-Code-Developer</tspan></text>

    <g class="ln" style="animation-delay:2.9s">
      <rect x="330" y="494" width="22" height="14" fill="#3b3334"/>
      <rect x="352" y="494" width="22" height="14" fill="#5c5354"/>
      <rect x="374" y="494" width="22" height="14" fill="#7a1f28"/>
      <rect x="396" y="494" width="22" height="14" fill="#a3272f"/>
      <rect x="418" y="494" width="22" height="14" fill="#c9414d"/>
      <rect x="440" y="494" width="22" height="14" fill="#d8d3d2"/>
    </g>

    <text x="330" y="558" class="ln dim" style="animation-delay:3.0s"># readable at 3am, six months later</text>
  </g>

  <text x="24" y="602" class="mono ln" style="animation-delay:3.1s"><tspan class="usr">k3nd4rk@dev</tspan><tspan class="dim">:~$ </tspan></text>
  <rect class="cursor" x="141" y="591" width="8" height="15" fill="#b0303a"/>
