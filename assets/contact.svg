  <desc id="d">A terminal showing contact details, Discord kennum_ and github.com/K3nD4rk-Code-Developer, and what K3nD4rk is currently doing: building game systems and tooling, studying a foreign language, playing an instrument, teaching tech to beginners.</desc>
  <style>
