<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 260" width="405" height="260" role="img" aria-labelledby="t d">
  <title id="t">commits by hour</title>
  <desc id="d">A terminal showing a bar chart of commits by hour of day. The busiest hours are 9pm to 11pm.</desc>
  <style>
    .m { font-family: 'JetBrains Mono','DejaVu Sans Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size: 12px; }
    .val { fill: #d8d3d2; } .dim { fill: #7d7374; } .red { fill: #b0303a; }
    .b { transform-box: fill-box; transform-origin: 50% 100%; animation: rise 8s cubic-bezier(.2,.8,.2,1) infinite both; }
    @keyframes rise { 0%,3% { transform: scaleY(0); } 26%,88% { transform: scaleY(1); } 96%,100% { transform: scaleY(0); } }
    @media (prefers-reduced-motion: reduce) { .b { animation: none; transform: none; } }
  </style>
  <rect x="0.5" y="0.5" width="404" height="259" rx="10" fill="#0c0a0a" stroke="#2a2020"/>
  <path d="M0.5 30 V10.5 a10 10 0 0 1 10 -10 H394.5 a10 10 0 0 1 10 10 V30 Z" fill="#171213"/>
  <line x1="0" y1="30.5" x2="405" y2="30.5" stroke="#2a2020"/>
  <circle cx="18" cy="15.5" r="4.5" fill="#a3272f"/><circle cx="34" cy="15.5" r="4.5" fill="#4a4142"/><circle cx="50" cy="15.5" r="4.5" fill="#4a4142"/>
  <text x="202" y="19" text-anchor="middle" class="m dim">git: commit hours</text>

  <text x="16" y="54" class="m"><tspan class="red">$</tspan><tspan class="val"> git shortlog --by-hour</tspan></text>
  <text x="16" y="76" class="m dim"># commits by hour of day (UTC-5)</text>

  <line x1="18" y1="196.5" x2="388" y2="196.5" stroke="#2a2020"/>
  <g>
    <rect class="b" style="animation-delay:0s"    x="22"  y="136" width="10" height="60" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.05s"  x="37"  y="146" width="10" height="50" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.1s"   x="52"  y="166" width="10" height="30" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.15s"  x="67"  y="116" width="10" height="80" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.2s"   x="82"  y="166" width="10" height="30" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.25s"  x="97"  y="106" width="10" height="90" fill="#a3272f"/>
    <rect class="b" style="animation-delay:.3s"   x="112" y="126" width="10" height="70" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.35s"  x="127" y="186" width="10" height="10" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.4s"   x="142" y="156" width="10" height="40" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.5s"   x="172" y="186" width="10" height="10" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.6s"   x="202" y="106" width="10" height="90" fill="#a3272f"/>
    <rect class="b" style="animation-delay:.65s"  x="217" y="136" width="10" height="60" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.7s"   x="232" y="166" width="10" height="30" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.75s"  x="247" y="136" width="10" height="60" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.8s"   x="262" y="136" width="10" height="60" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.85s"  x="277" y="166" width="10" height="30" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.9s"   x="292" y="126" width="10" height="70" fill="#5c3033"/>
    <rect class="b" style="animation-delay:.95s"  x="307" y="156" width="10" height="40" fill="#5c3033"/>
    <rect class="b" style="animation-delay:1s"    x="322" y="136" width="10" height="60" fill="#5c3033"/>
    <rect class="b" style="animation-delay:1.05s" x="337" y="86"  width="10" height="110" fill="#c9414d"/>
    <rect class="b" style="animation-delay:1.1s"  x="352" y="86"  width="10" height="110" fill="#c9414d"/>
    <rect class="b" style="animation-delay:1.15s" x="367" y="136" width="10" height="60" fill="#5c3033"/>
  </g>
  <g class="m dim" text-anchor="middle">
    <text x="27" y="214">0</text><text x="117" y="214">6</text><text x="207" y="214">12</text><text x="297" y="214">18</text><text x="372" y="214">23</text>
  </g>
  <text x="16" y="248" class="m dim"># busiest 9pm to 11pm</text>
</svg>
