<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 260" width="405" height="260" role="img" aria-labelledby="t d">
  <title id="t">boot log</title>
  <desc id="d">A boot log listing achievements: FBLA National Leadership Conference finalist, Lockheed Martin CodeQuest winner, robotics, and volunteering.</desc>
  <style>
    .m { font-family: 'JetBrains Mono','DejaVu Sans Mono','Cascadia Mono',Menlo,Consolas,'Liberation Mono',monospace; font-size: 12px; }
    .val { fill: #d8d3d2; } .dim { fill: #7d7374; } .red { fill: #b0303a; } .ok { fill: #c9414d; }
    .row  { opacity: 0; animation: row 12s infinite both; }
    .pend { opacity: 0; animation: pend 12s infinite both; }
    .done { opacity: 0; animation: done 12s infinite both; }
    @keyframes row  { 0% { opacity: 0; } 3%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
    @keyframes pend { 0% { opacity: 0; } 3%,12% { opacity: 1; } 14%,100% { opacity: 0; } }
    @keyframes done { 0%,12% { opacity: 0; } 14%,92% { opacity: 1; } 96%,100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .row, .done { animation: none; opacity: 1; } .pend { display: none; } }
  </style>
  <rect x="0.5" y="0.5" width="404" height="259" rx="10" fill="#0c0a0a" stroke="#2a2020"/>
  <path d="M0.5 30 V10.5 a10 10 0 0 1 10 -10 H394.5 a10 10 0 0 1 10 10 V30 Z" fill="#171213"/>
  <line x1="0" y1="30.5" x2="405" y2="30.5" stroke="#2a2020"/>
  <circle cx="18" cy="15.5" r="4.5" fill="#a3272f"/><circle cx="34" cy="15.5" r="4.5" fill="#4a4142"/><circle cx="50" cy="15.5" r="4.5" fill="#4a4142"/>
  <text x="202" y="19" text-anchor="middle" class="m dim">journalctl: awards</text>

  <text x="16" y="54" class="m"><tspan class="red">$</tspan><tspan class="val"> journalctl -u career</tspan></text>

  <g class="m">
    <g style="animation-delay:0s" class="row">
      <text x="84" y="88" class="val">Started FBLA National Leadership Conf.</text>
      <text x="84" y="104" class="dim">finalist · national CS recognition</text>
    </g>
    <text class="pend" style="animation-delay:0s" x="16" y="88"><tspan class="dim">[ .... ]</tspan></text>
    <text class="done" style="animation-delay:0s" x="16" y="88"><tspan class="dim">[</tspan><tspan class="ok">  OK  </tspan><tspan class="dim">]</tspan></text>

    <g style="animation-delay:1.5s" class="row">
      <text x="84" y="128" class="val">Finished Lockheed Martin CodeQuest.</text>
      <text x="84" y="144" class="dim">winner · algorithmic efficiency</text>
    </g>
    <text class="pend" style="animation-delay:1.5s" x="16" y="128"><tspan class="dim">[ .... ]</tspan></text>
    <text class="done" style="animation-delay:1.5s" x="16" y="128"><tspan class="dim">[</tspan><tspan class="ok">  OK  </tspan><tspan class="dim">]</tspan></text>

    <g style="animation-delay:3s" class="row">
      <text x="84" y="168" class="val">Started Robotics.</text>
      <text x="84" y="184" class="dim">embedded systems, sensors, control logic</text>
    </g>
    <text class="pend" style="animation-delay:3s" x="16" y="168"><tspan class="dim">[ .... ]</tspan></text>
    <text class="done" style="animation-delay:3s" x="16" y="168"><tspan class="dim">[</tspan><tspan class="ok">  OK  </tspan><tspan class="dim">]</tspan></text>

    <g style="animation-delay:4.5s" class="row">
      <text x="84" y="208" class="val">Reached target Volunteering.</text>
      <text x="84" y="224" class="dim">teaching tech to beginners</text>
    </g>
    <text class="pend" style="animation-delay:4.5s" x="16" y="208"><tspan class="dim">[ .... ]</tspan></text>
    <text class="done" style="animation-delay:4.5s" x="16" y="208"><tspan class="dim">[</tspan><tspan class="ok">  OK  </tspan><tspan class="dim">]</tspan></text>
  </g>
</svg>
